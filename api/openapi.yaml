openapi: 3.1.0
info:
  title: shelfmark API
  version: 1.0.0
  description: |
    shelfmark 的 REST 接口契约。服务端、网页、插件都以此为准。
    WebDAV（/dav/，供 Floccus 同步）不在本文件内，见 docs/design.md 第 4 节。
    认证：网页用 Cookie 会话（写请求必须带 `X-Requested-With: shelfmark`），插件和脚本用 Bearer 令牌（scope 含 api）。
    时间均为 UTC RFC3339。条目 ID 在库内唯一，0 表示根。
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: users
  - name: tokens
  - name: libraries
  - name: items
  - name: discovery
  - name: history
  - name: reports
  - name: transfer
  - name: settings
  - name: ai

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            text/plain:
              schema: { type: string, example: "ok 1.0.0" }

  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      security: []
      responses:
        '200':
          description: 版本与功能开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }

  /api/v1/setup:
    post:
      tags: [auth]
      operationId: setupAdmin
      summary: 首次设置管理员，仅在没有任何用户时可用，成功后直接登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: 已创建并登录（Set-Cookie）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: 登录成功（Set-Cookie）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/access:
    post:
      tags: [auth]
      operationId: loginWithAccess
      summary: 用 Cloudflare Access 身份换会话（单点登录）。需要有效的 Access JWT 且邮箱在 SHELFMARK_CF_ACCESS_USERS 里有映射
      security: []
      responses:
        '200':
          description: 已登录（Set-Cookie）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: 已退出 }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: 已修改（其它会话失效） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/auth/token:
    post:
      tags: [auth]
      operationId: createTokenWithPassword
      summary: 用用户名密码换一个令牌（插件登录用），无需会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name, scopes]
              properties:
                username: { type: string }
                password: { type: string }
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { $ref: '#/components/schemas/Scope' }
                  minItems: 1
      responses:
        '201':
          description: 令牌（明文只返回这一次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: 仅管理员
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: 仅管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { $ref: '#/components/schemas/Username' }
                password: { type: string, minLength: 8 }
                isAdmin: { type: boolean, default: false }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [users]
      operationId: updateUser
      summary: 仅管理员；重置密码或调整管理员身份
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 8 }
                isAdmin: { type: boolean }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: 仅管理员；不能删除自己和最后一个管理员
      responses:
        '204': { description: 已删除（连同其全部数据） }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      responses:
        '200':
          description: 当前用户的令牌（不含已吊销）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
    post:
      tags: [tokens]
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { $ref: '#/components/schemas/Scope' }
                  minItems: 1
      responses:
        '201':
          description: 令牌（明文只返回这一次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenCreated' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [tokens]
      operationId: revokeToken
      responses:
        '204': { description: 已吊销 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/floccus/setup:
    post:
      tags: [tokens]
      operationId: setupFloccusDevice
      summary: 为一台 Floccus 设备生成 dav 令牌和配置信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library, deviceName]
              properties:
                library: { $ref: '#/components/schemas/Slug' }
                deviceName: { type: string, maxLength: 80 }
      responses:
        '201':
          description: 配置信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloccusSetup' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries:
    get:
      tags: [libraries]
      operationId: listLibraries
      responses:
        '200':
          description: 当前用户的库
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Library' }
    post:
      tags: [libraries]
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/libraries/{slug}:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [libraries]
      operationId: getLibrary
      responses:
        '200':
          description: 库信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [libraries]
      operationId: updateLibrary
      summary: 改名或改 slug（改 slug 等于改 WebDAV 文件名，Floccus 需同步修改）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [libraries]
      operationId: deleteLibrary
      parameters:
        - name: confirm
          in: query
          required: true
          description: 必须等于 slug
          schema: { type: string }
      responses:
        '204': { description: 已删除（条目、修订一并删除） }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/libraries/{slug}/lock/release:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    post:
      tags: [libraries]
      operationId: releaseLibraryLock
      summary: 强制删除 Floccus 锁文件
      responses:
        '204': { description: 已解锁 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/tree:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [items]
      operationId: getTree
      description: ETag 形如 "r<revision>-<变更序号>"，每次内容变化都会变（合并进上一修订的连续编辑也会变）；If-None-Match 按完整 ETag 比较
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string, example: '"r42"' }
      responses:
        '200':
          description: 整棵树
          headers:
            ETag: { schema: { type: string, example: '"r42"' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
        '304': { description: 未变化 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/items:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    post:
      tags: [items]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteItemResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: getItem
      responses:
        '200':
          description: 条目（文件夹不含 children）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemWithPath' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteItemResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: 删除条目；文件夹连同子孙删除
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/items/batch:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    post:
      tags: [items]
      operationId: batchItems
      summary: 原子批量操作，全部成功或全部失败
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
      responses:
        '200':
          description: 已应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/items/{itemId}/transfer:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [items]
      operationId: transferItem
      summary: 把条目（文件夹连同子孙）移到另一个库；目标库分配新 ID，备注、标签、访问次数、图标、检测结果都保留；两个库各生成一个修订
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library, parentId]
              properties:
                library: { $ref: '#/components/schemas/Slug' }
                parentId: { type: integer, format: int64, description: 目标库里的父文件夹，0 为根 }
                position: { type: integer, minimum: 0, description: 不传则追加到末尾 }
      responses:
        '200':
          description: 已移动
          content:
            application/json:
              schema:
                type: object
                required: [revision, sourceRevision, item]
                properties:
                  revision: { type: integer, format: int64, description: 目标库的修订号 }
                  sourceRevision: { type: integer, format: int64, description: 源库的修订号 }
                  item: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/recent:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [discovery]
      operationId: listRecent
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 最近添加的书签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemWithPath' }

  /api/v1/libraries/{slug}/frequent:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [discovery]
      operationId: listFrequent
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 访问最多的书签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemWithPath' }

  /api/v1/recent:
    get:
      tags: [discovery]
      operationId: listRecentAll
      summary: 当前用户所有库里最近添加的书签
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 最近添加的书签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemWithPath' }

  /api/v1/frequent:
    get:
      tags: [discovery]
      operationId: listFrequentAll
      summary: 当前用户所有库里访问最多的书签
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 访问最多的书签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemWithPath' }

  /api/v1/quick-save:
    post:
      tags: [items]
      operationId: quickSave
      summary: 快速收藏（插件、分享、书签小工具用）。不指定位置时用设置里的默认收藏位置，未设置则存到库 bookmarks 根下的“收件箱”文件夹（不存在则创建）；传了 library 没传 parentId 时存到该库根下的“收件箱”文件夹（不存在则创建）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickSaveRequest' }
      responses:
        '200':
          description: 该 URL 已存在（existed=true），未重复创建，也不修改已有书签（请求里的标题、标签、备注、位置都被忽略）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickSaveResult' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickSaveResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/lookup:
    get:
      tags: [discovery]
      operationId: lookupUrl
      summary: 按规范化 URL 查找所有库里的匹配
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 匹配结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LookupResult' }

  /api/v1/search:
    get:
      tags: [discovery]
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          description: 支持 普通词、"短语"、#标签、site:、in:、lib:、is:broken、is:duplicate、-排除
          schema: { type: string }
        - { name: library, in: query, schema: { $ref: '#/components/schemas/Slug' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

  /api/v1/tags:
    get:
      tags: [discovery]
      operationId: listTags
      responses:
        '200':
          description: 标签及使用次数
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagCount' }

  /api/v1/tags/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      tags: [discovery]
      operationId: renameTag
      summary: 改名；新名字已存在则合并
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/TagName' }
      responses:
        '204': { description: 已改名 }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [discovery]
      operationId: deleteTag
      responses:
        '204': { description: 已从所有书签移除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/visits:
    post:
      tags: [discovery]
      operationId: recordVisit
      summary: 记一次访问（网页用 sendBeacon 调用，可能是 text/plain 正文）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitRequest' }
          text/plain:
            schema: { type: string, description: VisitRequest 的 JSON 字符串 }
      responses:
        '204': { description: 已记录 }

  /api/v1/favicons/{faviconId}:
    parameters:
      - { name: faviconId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
    get:
      tags: [discovery]
      operationId: getFavicon
      summary: 图标；ID 是内容哈希，无需认证，长期缓存
      security: []
      responses:
        '200':
          description: 图片
          headers:
            Cache-Control: { schema: { type: string, example: 'public, max-age=31536000, immutable' } }
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/meta/fetch:
    post:
      tags: [discovery]
      operationId: fetchPageMeta
      summary: 抓取网页标题、描述、图标（新建书签对话框用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '200':
          description: 抓取结果（失败时字段为空，不报错）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/libraries/{slug}/revisions:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [history]
      operationId: listRevisions
      parameters:
        - { name: before, in: query, description: 取比该修订号小的, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 修订列表，新的在前
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/revisions/{rev}:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/Rev'
    get:
      tags: [history]
      operationId: getRevision
      responses:
        '200':
          description: 修订及其相对上一修订的差异
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/revisions/{rev}/export:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/Rev'
      - $ref: '#/components/parameters/ExportFormat'
    get:
      tags: [history]
      operationId: exportRevision
      responses:
        '200': { $ref: '#/components/responses/ExportFile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/revisions/{rev}/restore:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/Rev'
    post:
      tags: [history]
      operationId: restoreRevision
      summary: 整库回滚到该修订（生成新修订）
      responses:
        '200':
          description: 已回滚
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/deleted:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    get:
      tags: [history]
      operationId: listDeleted
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: 最近删除的条目，新的在前
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletedEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/deleted/restore:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    post:
      tags: [history]
      operationId: restoreDeleted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreDeletedRequest' }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreDeletedResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/pending:
    get:
      tags: [history]
      operationId: listPending
      summary: 当前用户所有库里被拦截、待确认的上传
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingUpload' }

  /api/v1/libraries/{slug}/pending/{pendingId}:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/PendingId'
    get:
      tags: [history]
      operationId: getPending
      responses:
        '200':
          description: 拦截详情和差异
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{slug}/pending/{pendingId}/approve:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/PendingId'
    post:
      tags: [history]
      operationId: approvePending
      responses:
        '200':
          description: 已应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/pending/{pendingId}/discard:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/PendingId'
    post:
      tags: [history]
      operationId: discardPending
      responses:
        '204': { description: 已丢弃 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reports/broken:
    get:
      tags: [reports]
      operationId: listBroken
      parameters:
        - { name: library, in: query, schema: { $ref: '#/components/schemas/Slug' } }
        - name: status
          in: query
          description: 不传则返回 redirect、broken、unreachable
          schema:
            type: array
            items: { $ref: '#/components/schemas/HealthStatus' }
          style: form
          explode: false
      responses:
        '200':
          description: 检测有问题的书签
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemWithPath' }

  /api/v1/reports/broken/recheck:
    post:
      tags: [reports]
      operationId: recheckLinks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library, itemIds]
              properties:
                library: { $ref: '#/components/schemas/Slug' }
                itemIds:
                  type: array
                  maxItems: 500
                  items: { type: integer, format: int64 }
      responses:
        '202': { description: 已排队 }

  /api/v1/reports/duplicates:
    get:
      tags: [reports]
      operationId: listDuplicates
      parameters:
        - { name: library, in: query, description: 不传则跨库, schema: { $ref: '#/components/schemas/Slug' } }
      responses:
        '200':
          description: 重复分组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DuplicateGroup' }

  /api/v1/jobs:
    get:
      tags: [reports]
      operationId: listJobs
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }

  /api/v1/jobs/{name}/run:
    parameters:
      - name: name
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JobName' }
    post:
      tags: [reports]
      operationId: runJob
      summary: 手动触发。linkcheck、metadata 只处理当前用户的数据；backup、retention、cleanup 仅管理员
      responses:
        '202': { description: 已开始 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/libraries/{slug}/import:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
    post:
      tags: [transfer]
      operationId: importBookmarks
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mode: { $ref: '#/components/schemas/ImportMode' }
                folderName: { type: string, description: 'mode=folder 时的文件夹名，默认“导入 YYYY-MM-DD”' }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '423': { $ref: '#/components/responses/Locked' }

  /api/v1/libraries/{slug}/export:
    parameters:
      - $ref: '#/components/parameters/LibrarySlug'
      - $ref: '#/components/parameters/ExportFormat'
    get:
      tags: [transfer]
      operationId: exportBookmarks
      responses:
        '200': { $ref: '#/components/responses/ExportFile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      responses:
        '200':
          description: 当前用户设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: 部分更新（顶层字段替换，startPage 整体替换）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/v1/ai/status:
    get:
      tags: [ai]
      operationId: getAiStatus
      responses:
        '200':
          description: AI 是否可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }

  /api/v1/ai/suggest:
    post:
      tags: [ai]
      operationId: aiSuggest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestRequest' }
      responses:
        '200':
          description: 建议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/v1/ai/organize:
    post:
      tags: [ai]
      operationId: aiOrganize
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiOrganizeRequest' }
      responses:
        '200':
          description: 整理建议
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiOrganizeResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: shelfmark_session
      description: 写请求还必须带请求头 X-Requested-With 为 shelfmark
    bearerAuth:
      type: http
      scheme: bearer
      description: scope 含 api 的令牌

  parameters:
    LibrarySlug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    ItemId:
      name: itemId
      in: path
      required: true
      description: 条目 ID，非 0；可能为负（Floccus 给缺 id 的条目派生负数 ID，服务端原样保存）
      schema: { type: integer, format: int64 }
    Rev:
      name: rev
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    PendingId:
      name: pendingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExportFormat:
      name: format
      in: query
      schema:
        type: string
        enum: [html, xbel, json]
        default: html

  responses:
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限（含 CSRF 校验失败）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validation:
      description: 参数不合法，details 里按字段给出原因
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: 库正被 Floccus 同步锁定；details 含 actor、since；响应头 Retry-After
      headers:
        Retry-After: { schema: { type: integer, example: 5 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 失败次数过多
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 文件太大
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: 无法识别的格式
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: 功能未启用或上游失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ExportFile:
      description: 导出文件（Content-Disposition 带文件名）
      content:
        text/html:
          schema: { type: string }
        application/xml:
          schema: { type: string }
        application/json:
          schema: { type: object }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    ErrorCode:
      type: string
      enum: [unauthorized, forbidden, not_found, conflict, locked, validation, payload_too_large,
             unsupported_media_type, rate_limited, guarded, unavailable, internal]

    Slug:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'

    Username:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,64}$'

    TagName:
      type: string
      minLength: 1
      maxLength: 64
      description: 不含空白和逗号；比较时不区分大小写，保存时保留原样

    Timestamp:
      type: string
      format: date-time

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        password: { type: string }

    SystemInfo:
      type: object
      required: [version, commit, needsSetup, davPath, features]
      properties:
        version: { type: string }
        commit: { type: string }
        needsSetup: { type: boolean, description: 没有任何用户时为 true }
        davPath: { type: string, example: /dav/ }
        baseUrl: { type: [string, 'null'] }
        features:
          type: object
          required: [ai, metrics, linkcheck, metadata, autoCreateLibrary, cfAccessSso]
          properties:
            ai: { type: boolean }
            metrics: { type: boolean }
            linkcheck: { type: boolean }
            metadata: { type: boolean }
            autoCreateLibrary: { type: boolean }
            cfAccessSso: { type: boolean, description: 已配置 Access 单点登录映射 }

    User:
      type: object
      required: [id, username, isAdmin, createdAt]
      properties:
        id: { type: integer, format: int64 }
        username: { $ref: '#/components/schemas/Username' }
        isAdmin: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    Me:
      type: object
      required: [user, authMethod]
      properties:
        user: { $ref: '#/components/schemas/User' }
        authMethod: { type: string, enum: [session, token, access] }

    Scope:
      type: string
      enum: [api, dav]

    Token:
      type: object
      required: [id, name, scopes, prefix, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        prefix: { type: string, description: 明文前 8 位 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastUsedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        lastUsedIp: { type: [string, 'null'] }

    TokenCreated:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: '明文，形如 smk_xxx，只返回这一次' }

    FloccusSetup:
      type: object
      required: [token, library, davUrl, username, bookmarkFile]
      properties:
        token: { $ref: '#/components/schemas/TokenCreated' }
        library: { $ref: '#/components/schemas/Slug' }
        davUrl: { type: string, description: 'Floccus 的服务器地址，如 https://bm.example.com/dav/；未配置 BASE_URL 时按请求推断' }
        username: { type: string }
        bookmarkFile: { type: string, example: bookmarks.xbel }
        profile:
          description: |
            可直接导入 Floccus 的配置 JSON（格式按 Floccus 源码）；服务端无法保证格式时为 null。
            Floccus「导入配置」读取的是账号数组（Account.export 的输出），所以服务端返回数组，原样 JSON.stringify 后存为 profileFileName 即可导入。
          oneOf:
            - { type: array, items: { type: object, additionalProperties: true } }
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        profileFileName: { type: [string, 'null'] }

    LockInfo:
      type: object
      required: [actor, since, modifiedAt, fresh]
      properties:
        actor: { type: string, description: 写锁的设备令牌名 }
        since: { $ref: '#/components/schemas/Timestamp' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        fresh: { type: boolean, description: 15 分钟内续过锁 }

    Library:
      type: object
      required: [slug, name, davFile, revision, highestId, bookmarkCount, folderCount, createdAt, updatedAt, pendingCount]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        davFile: { type: string, example: bookmarks.xbel }
        revision: { type: integer, format: int64 }
        highestId: { type: integer, format: int64 }
        bookmarkCount: { type: integer }
        folderCount: { type: integer }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        lastSyncAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        lastSyncActor: { type: [string, 'null'] }
        lock: { oneOf: [{ $ref: '#/components/schemas/LockInfo' }, { type: 'null' }] }
        pendingCount: { type: integer }

    ItemType:
      type: string
      enum: [folder, bookmark]

    HealthStatus:
      type: string
      enum: [ok, redirect, broken, unreachable, skipped, unknown]

    Health:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        httpStatus: { type: [integer, 'null'] }
        finalUrl: { type: [string, 'null'] }
        checkedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        error: { type: [string, 'null'] }

    Item:
      type: object
      required: [id, type, parentId, position, title, createdAt, updatedAt, tags, visitCount]
      properties:
        id: { type: integer, format: int64, description: 非 0，可能为负（Floccus 派生的 ID） }
        type: { $ref: '#/components/schemas/ItemType' }
        parentId: { type: integer, format: int64, description: 0 为根；可能为负 }
        position: { type: integer, description: 兄弟间从 0 开始 }
        title: { type: string }
        url: { type: [string, 'null'], description: 仅书签 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        faviconId: { type: [string, 'null'] }
        health: { oneOf: [{ $ref: '#/components/schemas/Health' }, { type: 'null' }] }
        visitCount: { type: integer }
        lastVisitedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        children:
          type: array
          description: 仅在 tree 接口的文件夹上出现，按 position 排序
          items: { $ref: '#/components/schemas/Item' }

    ItemWithPath:
      type: object
      required: [library, item, path]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        item: { $ref: '#/components/schemas/Item' }
        path:
          type: array
          description: 从根到父文件夹的标题，根下为空数组
          items: { type: string }
        pathIds:
          type: array
          description: 与 path 对应的文件夹 ID
          items: { type: integer, format: int64 }

    Tree:
      type: object
      required: [library, revision, highestId, children]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        revision: { type: integer, format: int64 }
        highestId: { type: integer, format: int64 }
        children:
          type: array
          items: { $ref: '#/components/schemas/Item' }

    CreateItemRequest:
      type: object
      required: [type, title]
      properties:
        type: { $ref: '#/components/schemas/ItemType' }
        parentId: { type: integer, format: int64, default: 0 }
        position: { type: integer, minimum: 0, description: 不传则追加到末尾 }
        title: { type: string, maxLength: 2000 }
        url: { type: string, maxLength: 8192, description: 书签必填 }
        notes: { type: string, maxLength: 20000 }
        tags:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TagName' }

    UpdateItemRequest:
      type: object
      description: 只改传入的字段。parentId/position 同时或单独传表示移动；position 是移除自身后在目标文件夹里的最终下标（同一文件夹内移动也一样），超出则放末尾
      properties:
        title: { type: string, maxLength: 2000 }
        url: { type: string, maxLength: 8192 }
        notes: { type: [string, 'null'], maxLength: 20000 }
        tags:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TagName' }
        parentId: { type: integer, format: int64 }
        position: { type: integer, minimum: 0 }

    WriteResult:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }

    WriteItemResult:
      type: object
      required: [revision, item]
      properties:
        revision: { type: integer, format: int64 }
        item: { $ref: '#/components/schemas/Item' }

    BatchOp:
      oneOf:
        - $ref: '#/components/schemas/BatchCreate'
        - $ref: '#/components/schemas/BatchUpdate'
        - $ref: '#/components/schemas/BatchMove'
        - $ref: '#/components/schemas/BatchDelete'
        - $ref: '#/components/schemas/BatchTag'
      discriminator:
        propertyName: op
        mapping:
          create: '#/components/schemas/BatchCreate'
          update: '#/components/schemas/BatchUpdate'
          move: '#/components/schemas/BatchMove'
          delete: '#/components/schemas/BatchDelete'
          tag: '#/components/schemas/BatchTag'

    BatchCreate:
      type: object
      required: [op, type, title]
      properties:
        op: { type: string, const: create }
        ref: { type: string, description: 本批次内的临时引用名，供后续操作的 parentRef 使用 }
        type: { $ref: '#/components/schemas/ItemType' }
        parentId: { type: integer, format: int64 }
        parentRef: { type: string }
        position: { type: integer, minimum: 0 }
        title: { type: string }
        url: { type: string }
        notes: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagName' }

    BatchUpdate:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: update }
        id: { type: integer, format: int64 }
        title: { type: string }
        url: { type: string }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagName' }

    BatchMove:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: move }
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        parentRef: { type: string }
        position: { type: integer, minimum: 0, description: 移除自身后在目标文件夹里的最终下标；不传则追加到末尾 }

    BatchDelete:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: delete }
        id: { type: integer, format: int64 }

    BatchTag:
      type: object
      required: [op, id]
      properties:
        op: { type: string, const: tag }
        id: { type: integer, format: int64 }
        add:
          type: array
          items: { $ref: '#/components/schemas/TagName' }
        remove:
          type: array
          items: { type: string }

    BatchRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/BatchOp' }

    BatchResult:
      type: object
      required: [revision, created]
      properties:
        revision: { type: integer, format: int64 }
        created:
          type: object
          description: create 操作的 ref → 新 ID
          additionalProperties: { type: integer, format: int64 }

    QuickSaveRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 8192 }
        title: { type: string, description: 不传则服务端抓取 }
        library: { $ref: '#/components/schemas/Slug' }
        parentId: { type: integer, format: int64 }
        notes: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagName' }
        allowDuplicate: { type: boolean, default: false, description: 为 false 时目标库已有同一规范化 URL 就直接返回已有的 }

    QuickSaveResult:
      type: object
      required: [existed, library, item, path, revision]
      properties:
        existed: { type: boolean }
        library: { $ref: '#/components/schemas/Slug' }
        item: { $ref: '#/components/schemas/Item' }
        path:
          type: array
          items: { type: string }
        revision: { type: integer, format: int64 }

    LookupResult:
      type: object
      required: [url, normalizedUrl, matches]
      properties:
        url: { type: string }
        normalizedUrl: { type: string }
        matches:
          type: array
          items: { $ref: '#/components/schemas/ItemWithPath' }

    SearchHit:
      allOf:
        - $ref: '#/components/schemas/ItemWithPath'
        - type: object
          properties:
            highlights:
              type: object
              description: 带 <mark> 的片段，其余内容已做 HTML 转义
              properties:
                title: { type: string }
                url: { type: string }
                notes: { type: string }

    SearchResult:
      type: object
      required: [query, total, results]
      properties:
        query: { type: string }
        total: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }

    TagCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }

    VisitRequest:
      type: object
      required: [library, itemId]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        itemId: { type: integer, format: int64 }

    PageMeta:
      type: object
      required: [url]
      properties:
        url: { type: string }
        finalUrl: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        faviconId: { type: [string, 'null'] }

    RevisionSource:
      type: string
      enum: [webdav, web, api, extension, import, restore, system]

    Revision:
      type: object
      required: [rev, createdAt, source, actor, added, removed, changed, moved, totalBookmarks]
      properties:
        rev: { type: integer, format: int64 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        source: { $ref: '#/components/schemas/RevisionSource' }
        actor: { type: string, description: 设备令牌名或用户名 }
        added: { type: integer }
        removed: { type: integer }
        changed: { type: integer }
        moved: { type: integer }
        totalBookmarks: { type: integer }

    RevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
        nextBefore: { type: [integer, 'null'], format: int64 }

    DiffItem:
      type: object
      required: [id, type, title, path]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        url: { type: [string, 'null'] }
        path:
          type: array
          items: { type: string }
        notes: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        childCount: { type: integer, description: 文件夹被删时其子孙书签数 }

    DiffChange:
      type: object
      required: [id, type, path, before, after]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ItemType' }
        path:
          type: array
          items: { type: string }
        before:
          type: object
          required: [title]
          properties:
            title: { type: string }
            url: { type: [string, 'null'] }
        after:
          type: object
          required: [title]
          properties:
            title: { type: string }
            url: { type: [string, 'null'] }

    DiffMove:
      type: object
      required: [id, type, title, fromPath, toPath, fromPosition, toPosition]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        url: { type: [string, 'null'] }
        fromPath:
          type: array
          items: { type: string }
        toPath:
          type: array
          items: { type: string }
        fromPosition: { type: integer }
        toPosition: { type: integer }

    Diff:
      type: object
      required: [added, removed, changed, moved]
      properties:
        added:
          type: array
          items: { $ref: '#/components/schemas/DiffItem' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/DiffItem' }
        changed:
          type: array
          items: { $ref: '#/components/schemas/DiffChange' }
        moved:
          type: array
          description: 只列父文件夹变化的移动；同一文件夹内的重排只计数不列出
          items: { $ref: '#/components/schemas/DiffMove' }
        reorderedCount: { type: integer }

    RevisionDetail:
      type: object
      required: [revision, diff]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        diff: { $ref: '#/components/schemas/Diff' }

    DeletedEntry:
      type: object
      required: [revision, deletedAt, source, actor, item]
      properties:
        revision: { type: integer, format: int64, description: 删除发生的修订 }
        deletedAt: { $ref: '#/components/schemas/Timestamp' }
        source: { $ref: '#/components/schemas/RevisionSource' }
        actor: { type: string }
        item: { $ref: '#/components/schemas/DiffItem' }

    RestoreDeletedRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [revision, itemId]
            properties:
              revision: { type: integer, format: int64 }
              itemId: { type: integer, format: int64 }

    RestoreDeletedResult:
      type: object
      required: [revision, restored]
      properties:
        revision: { type: integer, format: int64 }
        restored: { type: integer, description: 恢复的条目数（含文件夹子孙） }

    PendingUpload:
      type: object
      required: [id, library, createdAt, actor, added, removed, changed, moved, totalBefore, reason]
      properties:
        id: { type: integer, format: int64 }
        library: { $ref: '#/components/schemas/Slug' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        actor: { type: string }
        added: { type: integer }
        removed: { type: integer }
        changed: { type: integer }
        moved: { type: integer }
        totalBefore: { type: integer }
        reason: { type: string }

    PendingDetail:
      type: object
      required: [pending, diff]
      properties:
        pending: { $ref: '#/components/schemas/PendingUpload' }
        diff: { $ref: '#/components/schemas/Diff' }

    DuplicateGroup:
      type: object
      required: [normalizedUrl, items]
      properties:
        normalizedUrl: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemWithPath' }

    JobName:
      type: string
      enum: [linkcheck, metadata, retention, cleanup, backup]

    Job:
      type: object
      required: [name, enabled, running]
      properties:
        name: { $ref: '#/components/schemas/JobName' }
        enabled: { type: boolean }
        running: { type: boolean }
        lastStartedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        lastFinishedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        lastOk: { type: [boolean, 'null'] }
        lastSummary: { type: [string, 'null'] }
        nextRunAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }

    ImportMode:
      type: string
      enum: [folder, merge, replace]
      default: folder

    ImportResult:
      type: object
      required: [format, mode, addedBookmarks, addedFolders, skippedDuplicates, revision]
      properties:
        format: { type: string, enum: [html, xbel, json] }
        mode: { $ref: '#/components/schemas/ImportMode' }
        addedBookmarks: { type: integer }
        addedFolders: { type: integer }
        skippedDuplicates: { type: integer }
        revision: { type: integer, format: int64 }

    SaveTarget:
      type: object
      required: [library, folderId]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        folderId: { type: integer, format: int64 }

    StartSection:
      type: object
      required: [id, library, folderId, layout, collapsed]
      properties:
        id: { type: string, description: 前端生成的唯一 ID }
        library: { $ref: '#/components/schemas/Slug' }
        folderId: { type: integer, format: int64 }
        title: { type: [string, 'null'], description: 不填用文件夹名 }
        layout: { type: string, enum: [grid, list] }
        collapsed: { type: boolean }

    StartPage:
      type: object
      required: [showSearch, showRecent, recentCount, showFrequent, frequentCount, sections]
      properties:
        showSearch: { type: boolean }
        showRecent: { type: boolean }
        recentCount: { type: integer, minimum: 1, maximum: 50 }
        showFrequent: { type: boolean }
        frequentCount: { type: integer, minimum: 1, maximum: 50 }
        sections:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/StartSection' }

    Settings:
      type: object
      required: [language, theme, openInNewTab, defaultSave, recentSaveTargets, startPage]
      properties:
        language: { type: string, enum: [auto, zh-CN, en] }
        theme: { type: string, enum: [system, light, dark] }
        openInNewTab: { type: boolean }
        defaultSave: { oneOf: [{ $ref: '#/components/schemas/SaveTarget' }, { type: 'null' }] }
        recentSaveTargets:
          type: array
          maxItems: 10
          description: 最近收藏到的位置，服务端在每次 quick-save 后更新
          items: { $ref: '#/components/schemas/SaveTarget' }
        startPage: { $ref: '#/components/schemas/StartPage' }

    SettingsPatch:
      type: object
      properties:
        language: { type: string, enum: [auto, zh-CN, en] }
        theme: { type: string, enum: [system, light, dark] }
        openInNewTab: { type: boolean }
        defaultSave: { oneOf: [{ $ref: '#/components/schemas/SaveTarget' }, { type: 'null' }] }
        startPage: { $ref: '#/components/schemas/StartPage' }

    AiStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        model: { type: [string, 'null'] }

    AiSuggestRequest:
      type: object
      required: [library, url]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        url: { type: string }
        title: { type: string }

    AiFolderSuggestion:
      type: object
      required: [folderId, path, score]
      properties:
        folderId: { type: integer, format: int64 }
        path:
          type: array
          description: 含该文件夹自身
          items: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }

    AiSuggestion:
      type: object
      required: [folders, tags]
      properties:
        title: { type: [string, 'null'] }
        folders:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/AiFolderSuggestion' }
        tags:
          type: array
          maxItems: 5
          items: { type: string }

    AiOrganizeRequest:
      type: object
      required: [library, folderId]
      properties:
        library: { $ref: '#/components/schemas/Slug' }
        folderId: { type: integer, format: int64 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }

    AiOrganizeResult:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [itemId, title, url, folderId, path, tags]
            properties:
              itemId: { type: integer, format: int64 }
              title: { type: string }
              url: { type: string }
              folderId: { type: integer, format: int64 }
              path:
                type: array
                items: { type: string }
              tags:
                type: array
                items: { type: string }
