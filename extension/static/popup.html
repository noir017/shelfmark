<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>shelfmark</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="popup">
  <header class="bar">
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <span class="brand">shelfmark</span>
    <button id="open-options" class="icon-btn" type="button" data-i18n-title="openSettings">⚙</button>
  </header>

  <section id="view-setup" class="view" hidden>
    <p data-i18n="popupNotConfigured"></p>
    <button id="setup-btn" class="primary" type="button" data-i18n="openSettings"></button>
  </section>

  <section id="view-unsupported" class="view" hidden>
    <p data-i18n="popupUnsupported"></p>
  </section>

  <section id="view-main" class="view" hidden>
    <div id="status" class="status" role="status"></div>
    <ul id="locations" class="locations" hidden></ul>
    <form id="form" autocomplete="off">
      <label class="field">
        <span data-i18n="fieldTitle"></span>
        <input id="f-title" type="text" maxlength="2000">
      </label>
      <p id="page-url" class="url muted"></p>
      <div class="field">
        <span data-i18n="fieldLocation"></span>
        <div id="picker"></div>
      </div>
      <label class="field">
        <span data-i18n="fieldTags"></span>
        <input id="f-tags" type="text" data-i18n-placeholder="tagsPlaceholder">
      </label>
      <label class="field">
        <span data-i18n="fieldNotes"></span>
        <textarea id="f-notes" rows="3" maxlength="20000"></textarea>
      </label>
      <div id="ai" class="ai" hidden>
        <button id="ai-btn" type="button" class="secondary" data-i18n="popupAiSuggest"></button>
        <div id="ai-result" class="chips"></div>
      </div>
      <div class="actions">
        <button id="delete-btn" type="button" class="danger" hidden></button>
        <button id="save-btn" type="submit" class="primary"></button>
      </div>
    </form>
  </section>

  <p id="message" class="message" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
