<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="newtabTitle">New Tab</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body class="newtab">
  <div id="banner" class="banner" role="status" hidden></div>
  <main class="wrap">
    <form id="search-form" class="search" role="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="newtabSearch">
    </form>
    <ul id="results" class="results" hidden></ul>
    <div id="content" class="content"></div>
    <p id="hint" class="hint" hidden></p>
  </main>
  <footer class="foot">
    <a href="options.html" data-i18n="openSettings"></a>
    <a id="server-link" href="#" hidden data-i18n="newtabOpenWeb"></a>
  </footer>
  <script src="newtab.js"></script>
</body>
</html>
