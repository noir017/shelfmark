<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">shelfmark</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/options.css">
</head>
<body class="options">
  <main>
    <h1><img src="icons/icon-48.png" alt="" width="28" height="28"> <span data-i18n="optionsTitle"></span></h1>

    <section class="card">
      <h2 data-i18n="sectionServer"></h2>
      <label class="field">
        <span data-i18n="fieldServerUrl"></span>
        <input id="server-url" type="url" placeholder="https://bm.example.com" autocomplete="url">
      </label>
      <p class="help" data-i18n="serverUrlHelp"></p>

      <details id="access-box" class="access">
        <summary data-i18n="accessTitle"></summary>
        <p class="help" data-i18n="accessHelp"></p>
        <label class="field">
          <span>Client ID</span>
          <input id="access-id" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span>Client Secret</span>
          <input id="access-secret" type="password" autocomplete="off" spellcheck="false">
        </label>
      </details>

      <form id="token-form">
        <label class="field">
          <span data-i18n="fieldToken"></span>
          <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="smk_…">
        </label>
        <p class="help" data-i18n="tokenHelp"></p>
        <button id="token-btn" type="submit" class="primary" data-i18n="saveToken"></button>
      </form>

      <p id="conn-status" class="status-line" role="status" aria-live="polite"></p>
      <div class="row">
        <button id="test-btn" type="button" data-i18n="testConnection"></button>
        <button id="logout-btn" type="button" class="danger" data-i18n="logout" hidden></button>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionDefaultSave"></h2>
      <select id="default-save" disabled>
        <option value="" data-i18n="defaultSaveServer"></option>
      </select>
      <p class="help" data-i18n="defaultSaveHelp"></p>
      <p id="default-save-msg" class="status-line" role="status"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionNewTab"></h2>
      <label class="check">
        <input id="newtab-toggle" type="checkbox">
        <span data-i18n="newTabToggle"></span>
      </label>
      <p class="help" data-i18n="newTabHelp"></p>
      <p id="newtab-msg" class="status-line" role="status"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionShortcuts"></h2>
      <p><span data-i18n="shortcutLabel"></span> <kbd id="shortcut">Alt+Shift+S</kbd></p>
      <p class="help" data-i18n="shortcutHelp"></p>
      <p><span data-i18n="omniboxLabel"></span> <kbd>sm</kbd></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
